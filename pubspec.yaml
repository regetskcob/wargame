name: wargame_workspace
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - packages/game

dev_dependencies:
  melos: ^8.9.0

melos:
  scripts:
    analyze:
      run: flutter analyze .
      description: Analyze all packages from the workspace root.
    format:
      run: dart format --set-exit-if-changed .
      description: Verify that all Dart files are formatted.
    format:fix:
      run: dart format .
      description: Format all Dart files.
    game:
      run: melos exec --scope=game -- flutter run -d chrome
      description: Run the game in Chrome.
    build:game:web:
      run: melos exec --scope=game -- flutter build web
      description: Build the game for the web.
    build:game:apk:
      run: melos exec --scope=game -- flutter build apk --release
      description: Build the game as an Android APK.
    build:game:appbundle:
      run: melos exec --scope=game -- flutter build appbundle --release
      description: Build the game as an Android App Bundle for Google Play.
    build:game:ios:
      run: melos exec --scope=game -- flutter build ios --release
      description: Build the game for iOS (needs Xcode and a signing team).
