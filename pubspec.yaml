name: wargame
description: "Last-tank-standing multiplayer Panzergefecht built with Flame and Supabase."
publish_to: none
version: 1.8.1+18

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  app_links: ^7.2.2
  audioplayers: ^6.8.1
  audioplayers_tvos: ^0.0.2
  audioplayers_watchos: ^0.1.0
  clock: ^1.1.2
  crypto: ^3.0.7
  flame: ^2.0.0-dev.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tvos: ^1.1.3
  flutter_watch_link: ^0.1.1
  flutter_watchos: ^0.1.0
  go_router: ^18.0.2
  # The design system shared with the other projects of regetskcob: theme,
  # tokens, fonts (Mona Sans, Literata, Monaspace) and a few widgets. Pinned
  # to a tag, never main; bump it as its CHANGELOG says.
  horizont:
    git:
      url: https://github.com/regetskcob/horizont.git
      path: flutter
      ref: v0.9.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  mobile_scanner: ^7.4.2
  path_provider_tvos: ^0.0.3
  path_provider_watchos: ^0.1.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  shared_preferences_tvos: ^0.0.2
  shared_preferences_watchos: ^0.1.1
  supabase_flutter: ^3.0.0-dev.9
  url_launcher_tvos: ^0.0.1
  web: ^1.1.1
  x25519: ^0.1.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
  supabase: ^3.0.0-dev.9
  supabase_typegen: ^0.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    # The launch screen again, for the loading view that follows it.
    - assets/images/
  # The fonts (Mona Sans, Monaspace, Literata, Material Symbols) come with
  # the Horizont package; see docs/development.md "Fonts".
