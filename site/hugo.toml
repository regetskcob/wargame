# The landing page in front of the browser game. The pages workflow builds it
# into the root of the site and the Flutter game into play/ below it; the
# base URL comes from that workflow, this one is for `hugo server`.
baseURL = 'https://panzergefecht.de/'
title = 'Panzergefecht'
defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = false
disableKinds = ['taxonomy', 'term', 'section', 'rss', 'sitemap', 'robotstxt']
enableRobotsTXT = false

[languages]
  [languages.de]
    languageName = 'Deutsch'
    languageCode = 'de'
    weight = 1
    [languages.de.params]
      store = 'de-DE'
  [languages.en]
    languageName = 'English'
    languageCode = 'en'
    weight = 2
    [languages.en.params]
      store = 'en-US'

# Store texts and screenshots are used straight from where the apps keep
# them, so the page follows every store update without copies. The device
# frames, fonts, colours and the Feldseite layout come from Horizont, the
# design system, as a Hugo module pinned to a tag (go.mod, go.sum). Bump it
# with: hugo mod get github.com/regetskcob/horizont@vX.Y.Z
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = '../store/ios/metadata'
    target = 'assets/store/metadata'
  [[module.mounts]]
    source = '../store/ios/screenshots'
    target = 'assets/store/screenshots'
  [[module.mounts]]
    source = '../store/ios/header'
    target = 'assets/store/header'
  [[module.mounts]]
    source = '../store/ios/mac'
    target = 'assets/store/mac'
  [[module.mounts]]
    source = '../store/ios/tv'
    target = 'assets/store/tv'
  [[module.mounts]]
    source = '../store/ios/watch'
    target = 'assets/store/watch'
  [[module.mounts]]
    source = '../assets/images'
    target = 'assets/game'
  [[module.mounts]]
    source = '../web'
    target = 'static'
    includeFiles = ['/favicon.svg', '/favicon-32.png', '/icons/apple-touch-icon.png']
  # Apple reads the association file of the universal links only at the root
  # of the domain, and the site is that root.
  [[module.mounts]]
    source = '../store/ios'
    target = 'static/.well-known'
    includeFiles = ['/apple-app-site-association']
  # The mounts of docs/web.md in Horizont: tokens, icon names, CSS, partials,
  # shortcodes and the fonts, served from here (no font service).
  [[module.imports]]
    path = 'github.com/regetskcob/horizont'
    [[module.imports.mounts]]
      source = 'tokens'
      target = 'data'
    [[module.imports.mounts]]
      source = 'icons'
      target = 'data/horizont_icons'
      includeFiles = ['*.json']
    [[module.imports.mounts]]
      source = 'web/css'
      target = 'assets/css/horizont'
    [[module.imports.mounts]]
      source = 'web/partials'
      target = 'layouts/_partials/horizont'
    [[module.imports.mounts]]
      source = 'web/shortcodes'
      target = 'layouts/_shortcodes'
    [[module.imports.mounts]]
      source = 'web/js'
      target = 'assets/js/horizont'
    [[module.imports.mounts]]
      source = 'web/fonts'
      target = 'static/fonts'

[imaging]
  quality = 82

[params]
  # Where support requests go. The page has no server of its own, so the
  # form opens a written mail in the visitor's mail app.
  supportMail = 'regetskcob@icloud.com'

  # Ways into the betas of the apps until they are in the stores. Android
  # testers join the Google Group first: the closed test on Google Play only
  # lets in the group's members.
  [params.beta]
    testflight = 'https://testflight.apple.com/join/dzuEgCY3'
    testerGroup = 'https://groups.google.com/g/panzergefecht-tester'
    playTest = 'https://play.google.com/store/apps/details?id=de.regetskcob.wargame'

  # The store pages once the apps are out; empty until then, and the page
  # shows the betas only. Listed before the betas when set.
  [params.stores]
    appStore = ''
    googlePlay = ''
