devicesTitle: Auf jedem Bildschirm, in einem Raum
device-web: Im Browser
device-web-text: Sofort auf jedem Rechner, ohne Installation und ohne Anmeldung, mit Tastatur, Controller oder Handy.
device-phone: Handy und Tablet
device-phone-text: iPhone und iPad, Android-Handys und -Tablets bald bei Google Play. Zwei Daumen-Sticks, die dort erscheinen, wo dein Daumen aufsetzt, oder ein Game-Controller, auf dem Tablet auch zu zweit im geteilten Bildschirm.
device-gamepad: Handy als Controller
device-gamepad-text: QR-Code scannen, und dein Handy steuert deinen Panzer im Browser, auf dem Tablet oder bald auf dem Apple TV. Mit zwei Handys spielt ihr zu zweit an einem Bildschirm.
device-watch: Apple Watch
device-watch-text: Ein eigenes Spiel am Handgelenk. Die Digital Crown lenkt, der Panzer zielt und feuert selbst. Auf runden Wear-OS-Uhren bald bei Google Play.
device-tv: Apple TV · bald
device-tv-text: Auf dem großen Bildschirm mit Siri Remote, Controller oder Handy, zu zweit im Split-Screen oder im Stützpunkt-Duell. Kommt bald in den App Store.
device-mac: Mac · bald
device-mac-text: Im Vollbild mit Tastatur oder Game-Controller, mit zwei Controllern auch zu zweit im geteilten Bildschirm. Dieselbe App wie auf iPhone und iPad, kommt bald in den Mac App Store.
