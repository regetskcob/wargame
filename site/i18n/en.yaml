device-web: In the browser
device-web-text: Right away on any computer, nothing to install, no sign-up, with keyboard, controller or phone.
device-phone: Phone and tablet
device-phone-text: iPhone and iPad, Android phones and tablets soon on Google Play. Two thumb sticks that appear wherever your thumb lands, or a game controller, on a tablet also two players on a split screen.
device-gamepad: Phone as controller
device-gamepad-text: Scan a QR code and your phone steers your tank in the browser, on a tablet or soon on the TV. With two phones you play two on one screen.
device-chat: iMessage
device-chat-text: Invite right from the chat. The bubble opens the same room for everyone, for two for defense, the duel or Last Tank Standing, in a group for Last Tank Standing or capture the flag. After the round the result shows in the bubble.
device-watch: Apple Watch
device-watch-text: A game of its own on your wrist. The Digital Crown steers, the tank aims and fires by itself. Soon on round Wear OS watches through Google Play.
device-tv: TV · soon
device-tv-text: On the big screen with the remote, a controller or your phone, two players on a split screen or in the base duel. Apple TV is coming to the App Store soon, Android TV, Google TV and Fire TV with the Android app.
device-mac: Mac · soon
device-mac-text: Full screen with keyboard or a game controller, with two controllers also two players on a split screen. The same app as on iPhone and iPad, coming to the Mac App Store soon.
betaTitle: Test it early
betaLead: The apps are in beta. Want to be there early? Play them now and help with the finishing touches.
beta-ios: iPhone and iPad
beta-ios-text: Through Apple's TestFlight app. New versions come to the device by themselves.
beta-ios-link: Join on TestFlight
beta-android: Android
beta-android-text: In the closed test on Google Play, in two steps with the Google account of your phone.
beta-android-step1: Join the tester group
beta-android-step2: Become a tester and install
