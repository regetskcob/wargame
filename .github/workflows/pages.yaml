name: pages

# The one workflow every push to main starts: checks, then the deploy, in a
# single Linux job. In a private repository every runner minute counts
# against the plan (see "CI minutes" in docs/development.md), so the checks
# and the build share one checkout and one Flutter setup instead of running
# twice in ci and pages, and the native builds wait for a manual run of ci.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces the run still going: only the newest commit is
# deployed, and the cancelled minutes are no longer billed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A hung step would otherwise bill up to six hours.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The base path and address of the site (/wargame, served at
      # www.regetskcob.de/wargame/). The landing page sits at its root, the
      # game below it in play/.
      - id: pages
        uses: actions/configure-pages@v5
      # The cache keeps the SDK and the pub packages between runs, which
      # saves about a minute per push.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      # Hugo straight from its releases: the repository only allows GitHub's
      # own actions and the Flutter one. The landing page imports Horizont,
      # the design system, as a Hugo module (site/go.mod); Hugo fetches it
      # with the Go the runner image already has, so no setup-go.
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version
          go version
        env:
          HUGO_VERSION: 0.154.5
      - run: dart pub get
      # The same checks as tool/verify.sh --quick. Anything red stops the
      # deploy.
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags supabase,golden --coverage
      - run: dart run tool/coverage.dart --min 75
      - name: Build the game
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ]; then args+=(--dart-define=SUPABASE_URL="$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_KEY" ]; then args+=(--dart-define=SUPABASE_KEY="$SUPABASE_KEY"); fi
          if [ "$ACCOUNTS" = "true" ]; then args+=(--dart-define=ACCOUNTS=true); fi
          if [ -n "$MAX_PILOTS" ]; then args+=(--dart-define=MAX_PILOTS="$MAX_PILOTS"); fi
          if [ -n "$REALTIME_BUDGET" ]; then args+=(--dart-define=REALTIME_BUDGET="$REALTIME_BUDGET"); fi
          flutter build web --base-href "${BASE_PATH}/play/" --dart-define=WEB_URL="${BASE_URL}/play/" "${args[@]}"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          ACCOUNTS: ${{ vars.ACCOUNTS }}
          MAX_PILOTS: ${{ vars.MAX_PILOTS }}
          REALTIME_BUDGET: ${{ vars.REALTIME_BUDGET }}
      - name: Build the landing page
        run: hugo --source site --minify --baseURL "${BASE_URL}/" --destination "$GITHUB_WORKSPACE/build/site"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Put the game below the landing page
        # During maintenance (params.maintenance in site/hugo.toml) play/
        # holds the maintenance page instead, so links into the game land
        # there too. Its paths are absolute, so it works one level down.
        run: |
          if hugo config --source site --format json | jq -e '.params.maintenance == true' > /dev/null; then
            mkdir -p build/site/play
            cp build/site/index.html build/site/play/index.html
          else
            cp -R build/web build/site/play
          fi
      - name: Write the Impressum and privacy pages
        run: dart run tool/legal_pages.dart build/site
      # Kept one day only: artifact storage beyond the plan's 1 GB is billed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
