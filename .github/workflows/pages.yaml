name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: dart pub get
      # Red tests stop the deploy.
      - run: flutter test --exclude-tags supabase
        working-directory: packages/game
      - name: Build the game
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ]; then args+=(--dart-define=SUPABASE_URL="$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_KEY" ]; then args+=(--dart-define=SUPABASE_KEY="$SUPABASE_KEY"); fi
          if [ "$ACCOUNTS" = "true" ]; then args+=(--dart-define=ACCOUNTS=true); fi
          flutter build web --base-href "/${REPO_NAME}/" "${args[@]}"
        working-directory: packages/game
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          ACCOUNTS: ${{ vars.ACCOUNTS }}
      - run: cp build/web/index.html build/web/404.html
        working-directory: packages/game
      - name: Write the Impressum and privacy pages
        run: dart run tool/legal_pages.dart build/web
        working-directory: packages/game
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/game/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
