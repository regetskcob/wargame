name: ci

# Pushes to main are checked by the pages workflow, which deploys in the same
# job. This one checks pull requests on Linux and builds the native apps
# only when started by hand (Actions > ci > Run workflow, or
# `gh workflow run ci`): a macOS minute costs ten Linux minutes in a private
# repository, and tool/release.sh verify builds iOS, the Mac app and Android locally
# before a push that needs them. See "CI minutes" in docs/development.md.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      apple:
        description: iOS and Mac app (macOS runner, ten times the minutes)
        type: boolean
        default: true
      android:
        description: Android and Wear OS app bundles
        type: boolean
        default: true
      watchos:
        description: Apple Watch app for the Simulator (macOS runner)
        type: boolean
        default: false

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The gate reads the commit statuses of the pull request head.
permissions:
  contents: read
  statuses: read

jobs:
  # tool/release.sh push marks a commit that tool/release.sh verify checked
  # on this Mac with the status werkbank/verify (tool/werkbank/STANDARD.md,
  # "Stempel statt doppelter Prüfung"). With it the check below is skipped;
  # without it, or when GitHub cannot be asked, the check runs.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      verified: ${{ steps.stamp.outputs.verified }}
    steps:
      - id: stamp
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          verified=false
          for _ in 1 2 3; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == "werkbank/verify" and .creator.login == "'"$GITHUB_REPOSITORY_OWNER"'")][0].state // ""' \
              2>/dev/null || true)
            if [ "$state" = success ]; then verified=true; break; fi
            sleep 10
          done
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gate.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: dart pub get
      # Folder structure as in tool/werkbank/STANDARD.md.
      - run: tool/werkbank/bin/werkbank layout
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags supabase,golden --coverage
      - run: dart run tool/coverage.dart --min 75

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.apple
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: dart pub get
      - run: flutter build ios --release --no-codesign
      # No certificate here: sign the Mac app ad hoc instead of with the
      # team from apple/Signing.xcconfig. An ad hoc signature cannot carry
      # associated domains, so the room links come out of this build.
      - run: printf 'DEVELOPMENT_TEAM =\nCODE_SIGN_IDENTITY = -\n' > apple/Signing.local.xcconfig
      - run: /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.associated-domains' macos/Runner/Release.entitlements
      - run: flutter build macos --release

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: dart pub get
      - run: flutter build appbundle --release
      # The same app for Wear OS watches, with the watch manifest.
      - run: flutter build appbundle --release --android-project-arg=wear=true

  # Builds the Apple Watch app for the Simulator, which needs no
  # flutter-watchos account. Release builds for the watch stay local for now,
  # see "Apple Watch" in docs/platforms.md.
  watchos:
    if: github.event_name == 'workflow_dispatch' && inputs.watchos
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      FLUTTER_WATCHOS_VERSION: v3.47.5-watchos.0.1.1
    steps:
      - uses: actions/checkout@v7
      - name: Install flutter-watchos
        run: |
          git clone --depth 1 --branch "$FLUTTER_WATCHOS_VERSION" \
            https://github.com/flutterwatch/flutter-watchos.git "$RUNNER_TEMP/flutter-watchos"
          echo "$RUNNER_TEMP/flutter-watchos/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter-watchos/engine_artifacts
          key: flutter-watchos-${{ env.FLUTTER_WATCHOS_VERSION }}
      - run: xcodebuild -version
      - run: flutter-watchos precache
      - run: flutter-watchos build watchos --simulator
