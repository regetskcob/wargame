name: testflight

# Builds the signed iOS, Apple TV or Mac app and uploads it to TestFlight,
# optionally the store texts and screenshots too. Started by hand from the
# Actions tab, see store/ios/README.md for the secrets. All three platforms
# share the bundle id, the team (apple/Signing.xcconfig) and the App Store
# record.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Apple platform to build
        type: choice
        options: [ios, tvos, macos]
        default: ios
      build:
        description: Build and upload to TestFlight
        type: boolean
        default: true
      metadata:
        description: Upload the store texts and screenshots too
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ios
      - run: dart pub get
      - name: Write the App Store Connect key
        run: echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/asc.p8"
        env:
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
      - name: Import the distribution certificate
        # Only with IOS_DIST_P12_BASE64 set. flutter-tvos signs the engine with
        # it during its build, so it comes before the builds.
        if: inputs.build
        run: bundle exec fastlane certificate
        working-directory: ios
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      - name: Collect the build arguments
        if: inputs.build
        # The build number has to grow with every upload. The run number
        # plus one stays above the manual first upload with +1.
        run: |
          args="--build-number=$((GITHUB_RUN_NUMBER + 1))"
          if [ -n "$SUPABASE_URL" ]; then args+=" --dart-define=SUPABASE_URL=$SUPABASE_URL"; fi
          if [ -n "$SUPABASE_KEY" ]; then args+=" --dart-define=SUPABASE_KEY=$SUPABASE_KEY"; fi
          if [ "$ACCOUNTS" = "true" ]; then args+=" --dart-define=ACCOUNTS=true"; fi
          if [ -n "$MAX_PILOTS" ]; then args+=" --dart-define=MAX_PILOTS=$MAX_PILOTS"; fi
          if [ -n "$REALTIME_BUDGET" ]; then args+=" --dart-define=REALTIME_BUDGET=$REALTIME_BUDGET"; fi
          echo "BUILD_ARGS=$args" >> "$GITHUB_ENV"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          ACCOUNTS: ${{ vars.ACCOUNTS }}
          MAX_PILOTS: ${{ vars.MAX_PILOTS }}
          REALTIME_BUDGET: ${{ vars.REALTIME_BUDGET }}
      - name: Prepare the iOS build
        if: inputs.build && inputs.platform == 'ios'
        run: flutter build ios --config-only --release $BUILD_ARGS
      - name: Prepare the Apple TV build
        # Stages the engine (signed with the distribution certificate),
        # App.framework and the plugins; fastlane archives and signs the app.
        if: inputs.build && inputs.platform == 'tvos'
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_TVOS_VERSION" \
            https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
          "$RUNNER_TEMP/flutter-tvos/bin/flutter-tvos" build tvos --release --no-codesign $BUILD_ARGS
        env:
          FLUTTER_TVOS_VERSION: v3.47.6-tvos.1.11.1
      - name: Prepare the Mac build
        # flutter build macos has no --config-only, so it builds once with an
        # ad hoc signature (no development certificate here) to write the
        # Flutter settings; fastlane then archives and signs for the store.
        if: inputs.build && inputs.platform == 'macos'
        run: |
          printf 'DEVELOPMENT_TEAM =\nCODE_SIGN_IDENTITY = -\n' > apple/Signing.local.xcconfig
          flutter build macos --release $BUILD_ARGS
          rm apple/Signing.local.xcconfig
      - name: Upload to TestFlight
        if: inputs.build
        run: bundle exec fastlane ${{ inputs.platform == 'macos' && 'mac' || inputs.platform }} beta
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      - name: Upload the store texts and screenshots
        if: inputs.metadata && inputs.platform == 'ios'
        run: bundle exec fastlane metadata
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      - name: Keep the build
        if: inputs.build
        uses: actions/upload-artifact@v4
        with:
          name: panzergefecht-${{ inputs.platform }}-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            build/tvos/ipa/*.ipa
            build/macos/pkg/*.pkg
