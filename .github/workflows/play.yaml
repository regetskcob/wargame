name: play

# Builds the signed App Bundle and uploads it to Google Play. Started by
# hand from the Actions tab, see store/android/README.md for
# the secrets and the one manual upload Google needs first.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: draft until the store listing is complete
        type: choice
        options: [draft, completed]
        default: draft
      metadata:
        description: Upload the store texts, icon and screenshots too
        type: boolean
        default: false

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: android
      - run: dart pub get
      - name: Write the upload key
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          PROPS
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Build the App Bundle
        # The versionCode has to grow with every upload. The run number
        # plus one stays above the manual first upload with +1.
        run: |
          args=(--build-number=$((GITHUB_RUN_NUMBER + 1)))
          if [ -n "$SUPABASE_URL" ]; then args+=(--dart-define=SUPABASE_URL="$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_KEY" ]; then args+=(--dart-define=SUPABASE_KEY="$SUPABASE_KEY"); fi
          if [ "$ACCOUNTS" = "true" ]; then args+=(--dart-define=ACCOUNTS=true); fi
          if [ -n "$MAX_PILOTS" ]; then args+=(--dart-define=MAX_PILOTS="$MAX_PILOTS"); fi
          if [ -n "$REALTIME_BUDGET" ]; then args+=(--dart-define=REALTIME_BUDGET="$REALTIME_BUDGET"); fi
          flutter build appbundle --release "${args[@]}"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          ACCOUNTS: ${{ vars.ACCOUNTS }}
          MAX_PILOTS: ${{ vars.MAX_PILOTS }}
          REALTIME_BUDGET: ${{ vars.REALTIME_BUDGET }}
      - name: Upload to Google Play
        run: >-
          bundle exec fastlane deploy
          track:${{ inputs.track }}
          release_status:${{ inputs.release_status }}
          metadata:${{ inputs.metadata }}
        working-directory: android
        env:
          PLAY_JSON_KEY: ${{ runner.temp }}/play.json
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
