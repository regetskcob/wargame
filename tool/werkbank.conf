# Settings for tool/werkbank (bash, sourced by tool/werkbank/bin/werkbank and
# tool/release.sh). Rules: tool/werkbank/STANDARD.md, "werkbank.conf".
# shellcheck shell=bash disable=SC2034

# Release files keep their old names (build/release/panzergefecht-…), the
# pubspec name is "wargame".
WB_APP=panzergefecht

# Beyond the standard (tvos/ and watchos/ are standard platform folders,
# .mcp.json a standard root file):
#   apple/     signing settings shared by the iOS, Mac and Apple TV projects
WB_TOP_EXTRA='apple'

# The whole repository (tool/*.dart, integration_test/,
# test_driver/ too).
WB_FORMAT_PATHS='.'

# Release (tool/release.sh release, STANDARD.md "Release"): one product, the
# app, on every store platform. Each has its own build here, because the IPA
# carries the watch app and Android ships a phone and a Wear OS bundle; they
# upload through werkbank (upload-apple, upload-play) with --upload.
WB_PLATFORMS_app='ios tvos macos android'
WB_PLAY_PACKAGE=de.regetskcob.wargame
# The service account key stays where fastlane's metadata lane expects it.
WB_PLAY_KEY="${PLAY_JSON_KEY:-$PWD/android/play-service-account.json}"
# Drafts until the release is checked in the Play Console (--completed in
# tool/release.sh android releases at once).
WB_PLAY_STATUS=draft
# The landing page deploys with every push to main (pages workflow);
# tool/release.sh site panzergefecht --live starts that workflow by hand.
WB_SITES='panzergefecht=site|https://panzergefecht.de/|workflow:pages.yaml'

build_ios() { if "$1"; then tool/archive_ios.sh --upload; else tool/archive_ios.sh; fi; }
build_tvos() { if "$1"; then tool/archive_apple.sh tvos --upload; else tool/archive_apple.sh tvos; fi; }
build_macos() { if "$1"; then tool/archive_apple.sh macos --upload; else tool/archive_apple.sh macos; fi; }
build_android() {
  local form
  for form in phone wear; do
    if "$1"; then tool/release_android.sh "$form" --upload "$WB_PLAY_TRACK"; else tool/release_android.sh "$form"; fi
  done
}

release_manual() {
  echo "- Play: release the drafts (phone and wear:$WB_PLAY_TRACK) in the Play Console"
  echo "- TestFlight: build $(wb_version build) must say Apple Watch: yes"
  echo "- docs/release-test-plan.md before promoting"
}

# The supabase tag needs the local stack (supabase start); coverage feeds the
# floor below. Goldens run here, on the Mac, but not in CI (fonts differ on
# Linux).
WB_TEST_ARGS='--exclude-tags supabase --coverage'

# The pull request CI (ci.yaml, job check) runs the quick checks only, so a
# green verify --quick is enough for the stamp tool/release.sh push sets.
WB_CI_VERIFY=quick

# The coverage floor, part of the quick check as in CI.
verify_quick_extra() {
  say "Coverage floor"
  dart run tool/coverage.dart --min 75
}

# The full check before a push that touches pubspec.*, ios/, android/, tvos/,
# the watch, assets, plugins or the version: every app the release scripts
# build, without signing.
# The landing page is built by werkbank itself (site/, WB_SITE_DIRS).
verify_extra() {
  say "flutter build web"
  flutter build web --no-web-resources-cdn
  say "flutter build ios --release --no-codesign"
  flutter build ios --release --no-codesign
  say "flutter build macos --release"
  flutter build macos --release
  say "flutter build appbundle --release (Wear OS)"
  flutter build appbundle --release --android-project-arg=wear=true
  # The phone bundle last, so build/ holds it afterwards.
  say "flutter build appbundle --release"
  flutter build appbundle --release
  say "Built: web, landing page, iOS, macOS, Android, Wear OS"
}
