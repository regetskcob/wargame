<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Panzergefecht – Last-tank-standing Mehrspieler-Panzerspiel im Browser. Spiele mit Freunden, bis nur noch ein Panzer übrig ist.">
  <meta name="theme-color" content="#2b3a22">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Panzergefecht">
  <meta property="og:description" content="Panzergefecht – Last-tank-standing Mehrspieler-Panzerspiel im Browser. Spiele mit Freunden, bis nur noch ein Panzer übrig ist.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Panzergefecht">
  <meta name="twitter:description" content="Panzergefecht – Last-tank-standing Mehrspieler-Panzerspiel im Browser. Spiele mit Freunden, bis nur noch ein Panzer übrig ist.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Panzergefecht">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=7">

  <!-- Favicon; the version query makes browsers drop the cached Flutter icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=7"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=7"/>

  <title>Panzergefecht</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The launch screen of the apps, until Flutter draws its loading view
       (lib/src/ui/loading_view.dart) over it in the same place. The
       pictures are Flutter's own assets, so the loading view finds them
       in the browser cache instead of loading them a second time. */
    html, body { margin: 0; height: 100%; background: #6E7949
      url(assets/assets/images/launch_ground.jpg) center / cover no-repeat; }
    #launch { position: fixed; left: 50%; top: 50%; width: 160px;
      transform: translate(-50%, -50%); }
    /* What happens while the first visit downloads several megabytes:
       without it the tank stood there for seconds as if nothing moved.
       Flutter's loading view covers it once it draws. */
    #status { position: fixed; left: 50%; top: calc(50% + 70px);
      transform: translateX(-50%); width: min(320px, 80vw);
      font: 600 13px/1.4 system-ui, sans-serif; color: #F1E9CF;
      text-align: center; text-shadow: 0 1px 3px #000; }
    #status .bar { height: 3px; margin: 0 auto 10px; width: 120px;
      background: rgba(0, 0, 0, 0.35); border-radius: 2px; overflow: hidden; }
    #status .bar::after { content: ''; display: block; height: 100%;
      width: 40%; background: #F2B33D; border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite; }
    #status .tip { margin-top: 6px; font-weight: 400; opacity: 0.85; }
    @keyframes slide { from { transform: translateX(-100%); }
      to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #status .bar::after { animation: none; width: 100%; opacity: 0.5; } }
  </style>
  <script>
    // The game speaks German on German browsers and English elsewhere.
    if (!(navigator.language || '').toLowerCase().startsWith('de')) {
      document.documentElement.lang = 'en';
      var text = 'Panzergefecht – last-tank-standing multiplayer tank game in the browser. Play with friends until only one tank is left.';
      document.querySelectorAll('meta[name="description"],meta[property="og:description"],meta[name="twitter:description"]')
        .forEach(function (m) { m.setAttribute('content', text); });
    }
  </script>
</head>
<body>
  <img id="launch" src="assets/assets/images/launch_tank.png" alt="">
  <div id="status" role="status">
    <div class="bar"></div>
    <div id="loading">Das Spiel lädt …</div>
    <div class="tip" id="tip"></div>
  </div>
  <script>
    (function () {
      var de = document.documentElement.lang === 'de';
      var tips = de ? [
        'Tipp: Ein Raum-Link lädt Freunde direkt in deinen Warteraum.',
        'Tipp: Dein Handy wird per QR-Code zum Controller.',
        'Tipp: Kisten bringen Reparatur, Nebel, Schnellfeuer und Minen.',
        'Tipp: Im Sperrgebiet verliert dein Panzer Panzerung.',
      ] : [
        'Tip: a room link brings friends straight into your waiting room.',
        'Tip: a QR code turns your phone into a controller.',
        'Tip: crates bring repairs, smoke, rapid fire and mines.',
        'Tip: the closed zone wears down your armour.',
      ];
      if (!de) {
        document.getElementById('loading').textContent = 'Loading the game …';
      }
      document.getElementById('tip').textContent =
        tips[Math.floor(Math.random() * tips.length)];
      // Gone once Flutter takes over the page, so a screen reader does not
      // keep announcing it; Flutter's loading view shows its own spinner.
      new MutationObserver(function (_, observer) {
        if (document.querySelector('flutter-view')) {
          document.getElementById('status').remove();
          observer.disconnect();
        }
      }).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
