publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  audioplayers: ^6.8.1
  flame: ^2.0.0-dev.1
  flutter:
    sdk: flutter
  supabase_flutter: ^3.0.0-dev.9
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  supabase: ^3.0.0-dev.9
  supabase_typegen: ^0.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
