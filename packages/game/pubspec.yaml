name: game
description: "Last-tank-standing multiplayer Panzergefecht built with Flame and Supabase."
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  app_links: ^7.2.2
  audioplayers: ^6.8.1
  flame: ^2.0.0-dev.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^3.0.0-dev.9
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
  supabase: ^3.0.0-dev.9
  supabase_typegen: ^0.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  # Bundled so every platform draws the same letters. The browser build
  # cannot reach system fonts and fell back to Roboto, while iOS and macOS
  # showed their own thin Courier New. Apache 2.0, see Roboto_LICENSE.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
