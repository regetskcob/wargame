  - id: devices-trio-gefecht-16x9
    path: streuwerk/media/devices/trio-gefecht-16x9.png
    kind: photo
    size: [1920, 1080]
    alt: Panzergefecht auf Mac, iPad und iPhone im Querformat, ein Gefecht in der Stadt.
  - id: devices-iphone-gefecht
