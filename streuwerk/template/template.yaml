# Panzergefecht template package for Streuwerk (regetskcob/streuwerk,
# docs/templates.md). Look: Horizont with Panzergefecht's own dark terrain
# (tool/horizont/horizont.product.json): olive surfaces, hairlines, signal
# yellow only for the one accent, Mona Sans, every number in Monaspace.
# House rules: no prices or paid packs, never "free", no real armies or flags.
name: panzergefecht
version: 2.0.0
description: Panzergefecht im Horizont-Look. Dunkles Oliv mit Haarlinien, Signalgelb als einziger Akzent, Literata-Überschriften wie auf panzergefecht.de, Mona Sans und Monaspace. Karussell- und Einzelbilder 4:5, Reels 9:16 beginnen in Bewegung, mit Spielszenen groß im Bild statt im Handyrahmen, Zoom auf den eigenen Panzer, Fahrzeuge und Kisten aus den echten Spielgrafiken auf bewegtem Oliv-Gelände. Kein Text in Versalien, Untertitel in einem eigenen Band unter dem Bild.

formats: [image, reel]

safe_zones:
  image: {top: 64, right: 64, bottom: 140, left: 64}
  reel: {top: 260, right: 120, bottom: 440, left: 80}

slides:
  cover:
    fields:
      kicker: {type: text, max: 32}
      title: {type: text, max: 60, required: true}
      text: {type: text, max: 120}
  point:
    fields:
      kicker: {type: text, max: 32}
      number: {type: text, max: 2}
      title: {type: text, max: 44, required: true}
      text: {type: text, max: 200}
  shot:
    fields:
      kicker: {type: text, max: 32}
      title: {type: text, max: 44, required: true}
      text: {type: text, max: 110}
      shot: {type: image, aspect: "9:16", required: true}
  list:
    fields:
      kicker: {type: text, max: 32}
      title: {type: text, max: 50, required: true}
      items: {type: list, max_items: 5, max: 60, required: true}
  # Three tiles of one panorama for the profile grid, posted right to left so
  # they read left to right: the device picture of panzergefecht.de runs
  # across all three, the text sits on the left tile, the button on the right.
  hero_left:
    fields:
      kicker: {type: text, max: 40}
      title: {type: text, max: 40, required: true}
      text: {type: text, max: 90}
  hero_middle:
    fields:
      caption: {type: text, max: 40}
  hero_right:
    fields:
      cta: {type: text, max: 24, required: true}
  end:
    fields:
      title: {type: text, max: 50, required: true}
      text: {type: text, max: 120}
      cta: {type: text, max: 32}

# Reels start moving in their first frame and never with a still text
# card. Every scene sits on the same drifting terrain, timed against the reel
# (not the scene), so cuts between scenes do not jump. Subtitles have their
# own band under the picture (style.css, .sw-subtitles), never over it.
scenes:
  # Opening: a vehicle (media:fahrzeug-<name>-quer) rolls in over the
  # terrain while the line is written in. Without a vehicle the terrain moves.
  hook:
    seconds: 2.5
    fields:
      kicker: {type: text, max: 32}
      heading: {type: text, max: 56, required: true}
      vehicle: {type: image, aspect: "1:1"}
  # Gameplay large: a full-screen shot without frame (16:9, the TV shots
  # media:tv-*, not the framed phone store pictures) fills the picture,
  # cut to its middle, and slowly pushes in. The camera follows the player's
  # tank, so it sits in the middle.
  play:
    seconds: 4
    fields:
      heading: {type: text, max: 44}
      picture: {type: image, aspect: "16:9", required: true}
  # Like play, but zooms from the whole screen into the middle, onto the
  # player's tank and what is around it.
  zoom:
    seconds: 4
    fields:
      heading: {type: text, max: 44}
      picture: {type: image, aspect: "16:9", required: true}
  # A recording large, e.g. a screencast of a round.
  clip:
    seconds: 5
    fields:
      heading: {type: text, max: 44}
      clip: {type: video, aspect: "9:16", required: true}
  # One piece of the game big on the terrain: a vehicle, a crate, a base
  # stage or a round map (media:fahrzeug-*, kiste-*, stuetzpunkt-*, karte-*).
  showcase:
    seconds: 3.5
    fields:
      kicker: {type: text, max: 32}
      heading: {type: text, max: 44, required: true}
      item: {type: image, aspect: "1:1", required: true}
      note: {type: text, max: 70}
  # The phone with a screenshot, for menus and the controller. Several shot
  # scenes in a row keep the phone in the same place; only the screen changes.
  shot:
    seconds: 4
    fields:
      heading: {type: text, max: 44, required: true}
      picture: {type: image, aspect: "9:16", required: true}
      note: {type: text, max: 70}
  points:
    seconds: 5
    fields:
      heading: {type: text, max: 44, required: true}
      points: {type: list, max_items: 4, max: 48, required: true}
  end:
    seconds: 3
    fields:
      end_title: {type: text, max: 40, required: true}
      end_text: {type: text, max: 100}
