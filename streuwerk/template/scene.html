<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body data-type="{{type}}" class="scene">
<div class="frame">
  <div class="horizon" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"></div>

  <section data-scene="hook" class="page hook">
    <div class="body" data-safe>
      {{#kicker}}<p class="kicker rise" data-field="kicker">{{kicker}}</p>{{/kicker}}
      <h1 class="title xl rise d1" data-field="heading">{{heading}}</h1>
    </div>
  </section>

  <section data-scene="shot" class="page shot">
    <div class="copy" data-safe>
      <h2 class="title rise" data-field="heading">{{heading}}</h2>
    </div>
    <div class="phone zoom" data-safe><img data-field="picture" src="{{picture}}" alt=""></div>
    {{#note}}<div class="note-wrap" data-safe><p class="note rise d2" data-field="note">{{note}}</p></div>{{/note}}
  </section>

  <section data-scene="points" class="page points">
    <div class="body" data-safe>
      <h2 class="title rise" data-field="heading">{{heading}}</h2>
      <ul class="items stagger" data-field="points">{{#points}}<li>{{.}}</li>{{/points}}</ul>
    </div>
  </section>

  <section data-scene="end" class="page end">
    <div class="body" data-safe>
      <img class="glyph big rise" src="images/glyph.svg" alt="">
      <h2 class="title rise d1" data-field="end_title">{{end_title}}</h2>
      {{#end_text}}<p class="text rise d2" data-field="end_text">{{end_text}}</p>{{/end_text}}
      <p class="url mono rise d3">panzergefecht.de</p>
    </div>
  </section>
</div>
</body>
</html>
